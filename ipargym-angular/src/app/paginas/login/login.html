<section class="formulario"><h1>Iniciar sesión</h1>
<form (ngSubmit)="login()" #form="ngForm">
<label for="email">Email</label><input id="email" type="email" name="email" [(ngModel)]="email" required email />
<label for="password">Contraseña</label><input id="password" type="password" name="password" [(ngModel)]="password" required />
@if (error()) { <p class="error" role="alert">{{ error() }}</p> }
<button type="submit" [disabled]="form.invalid || procesando()">Iniciar sesión</button>
</form></section>
